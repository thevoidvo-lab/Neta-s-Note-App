name: Build Neta's Notes APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -n 1)
          echo "zip yang ketemu: $ZIP"
          unzip "$ZIP" -d extracted
          echo "=== isi extracted ==="
          ls -la extracted

      - name: Cari gradlew
        id: find
        run: |
          GRADLEW=$(find extracted -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew ga ketemu"
            find extracted -type f | head -50
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "path=$DIR" >> $GITHUB_OUTPUT
          echo "gradlew ada di: $DIR"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0

      - name: Build APK
        working-directory: ${{ steps.find.outputs.path }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: netas-notes-apk
          path: ${{ steps.find.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
