
name: Build Neta's Notes APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install unzip + curl
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            exit 1
          fi

          echo "Extracting: $ZIP"
          unzip -o "$ZIP" -d extracted

      - name: Cari project root
        id: find
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

          echo "Project root: $DIR"

      - name: Bersihin file corrupt
        working-directory: ${{ steps.find.outputs.path }}
        shell: bash
        run: |
          rm -rf .gradle build app/build .idea local.properties
          find . -name "*.class" -delete

      - name: Patch import calculatePan/Zoom/Rotation
        working-directory: ${{ steps.find.outputs.path }}
        shell: bash
        run: |
          while IFS= read -r -d '' f; do
            sed -i \
              's|import androidx.compose.ui.input.pointer.calculatePan|import androidx.compose.foundation.gestures.calculatePan|g' \
              "$f"

            sed -i \
              's|import androidx.compose.ui.input.pointer.calculateZoom|import androidx.compose.foundation.gestures.calculateZoom|g' \
              "$f"

            sed -i \
              's|import androidx.compose.ui.input.pointer.calculateRotation|import androidx.compose.foundation.gestures.calculateRotation|g' \
              "$f"

            echo "=== $f ==="
            grep -n "calculate" "$f" || true
          done < <(
            find . \
              \( -name "CanvasView.kt" -o -name "ElementView.kt" \) \
              -print0
          )

      - name: Cek baris 155-180 CanvasView
        working-directory: ${{ steps.find.outputs.path }}
        shell: bash
        run: |
          F=$(find . -name "CanvasView.kt" -print -quit)

          if [ -z "$F" ]; then
            echo "CanvasView.kt tidak ditemukan."
            exit 0
          fi

          echo "=== FILE: $F ==="
          echo "=== baris 155-180 ==="
          sed -n '155,180p' "$F"

      - name: Generate debug.keystore
        working-directory: ${{ steps.find.outputs.path }}
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build APK
        working-directory: ${{ steps.find.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Java Version ==="
          java -version

          echo "=== Gradle Wrapper Properties ==="
          cat gradle/wrapper/gradle-wrapper.properties

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew tidak ditemukan di root project."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle-wrapper.jar tidak ditemukan."
            echo "Workflow tidak akan membuat atau memperbaiki Wrapper otomatis."
            exit 1
          fi

          chmod +x gradlew

          echo "=== Gradle Version ==="
          ./gradlew --version

          echo "=== Build Debug APK ==="
          ./gradlew assembleDebug --stacktrace --info

      - uses: actions/upload-artifact@v4
        with:
          name: netas-notes-apk
          path: ${{ steps.find.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
