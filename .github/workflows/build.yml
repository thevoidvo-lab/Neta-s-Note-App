name: Build Neta's Notes APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install unzip + curl
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -n 1)
          unzip -o "$ZIP" -d extracted

      - name: Cari project root
        id: find
        run: |
          SETTINGS=$(find extracted -name "settings.gradle*" -type f | head -n 1)
          DIR=$(dirname "$SETTINGS")
          echo "path=$DIR" >> $GITHUB_OUTPUT

      - name: Bersihin file corrupt
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          rm -rf .gradle build app/build .idea local.properties
          find . -name "*.class" -delete

      - name: Fix app/build.gradle
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          F=app/build.gradle
          echo "=== SEBELUM ==="
          cat "$F"

          # hapus baris plugin kotlin dobel
          sed -i "/apply plugin: ['\"]kotlin-android['\"]/d" "$F"
          sed -i "/apply plugin: ['\"]org.jetbrains.kotlin.android['\"]/d" "$F"
          sed -i "/id ['\"]org.jetbrains.kotlin.android['\"]/d" "$F"
          sed -i "/id ['\"]kotlin-android['\"]/d" "$F"

          # hapus baris kosong berlebih di awal
          sed -i '/^[[:space:]]*$/N;/^\n$/D' "$F"

          echo "=== SESUDAH ==="
          cat "$F"
          echo "=== END ==="

      - name: Fix package name & app name (Claude)
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          NEWPKG="com.example.notesappclaude"
          NEWNAME="Neta's Notes"

          for F in $(find . -name "build.gradle" -o -name "build.gradle.kts"); do
            sed -i "s|com\.example\.notesapp|$NEWPKG|g" "$F"
          done

          for F in $(find . -name "*.kt" -type f); do
            sed -i "s|^package com\.example\.notesapp|package $NEWPKG|g" "$F"
            sed -i "s|com\.example\.notesapp|$NEWPKG|g" "$F"
          done

          OLD_DIR=$(find app/src/main/java -type d -name "notesapp" | head -n 1)
          if [ -n "$OLD_DIR" ]; then
            NEW_DIR=$(echo "$OLD_DIR" | sed "s|/notesapp$|/notesappclaude|")
            mv "$OLD_DIR" "$NEW_DIR"
          fi

          for F in $(find . -name "strings.xml"); do
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$NEWNAME</string>|g" "$F"
          done

          echo "=== cek package ==="
          grep -rn "package com.example" app/src/main/java | head -5 || true
          echo "=== cek applicationId ==="
          grep -rn "applicationId\|namespace" app/build.gradle* | head -5 || true
          echo "=== cek app_name ==="
          grep -rn "app_name" app/src/main/res/values/strings.xml || true

      - name: Generate debug.keystore
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 9.3.1

      - name: Build APK
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: netas-notes-apk
          path: ${{ steps.find.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
