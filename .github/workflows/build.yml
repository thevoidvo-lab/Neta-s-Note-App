name: Build Neta's Notes APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "zip ga ketemu"; exit 1; fi
          unzip -o "$ZIP" -d extracted

      - name: Cari project root
        id: find
        run: |
          S=$(find extracted -name "settings.gradle*" -type f | head -n 1)
          if [ -z "$S" ]; then
            S=$(find extracted -path "*/app/build.gradle*" | head -n 1)
            DIR=$(dirname $(dirname "$S"))
          else
            DIR=$(dirname "$S")
          fi
          echo "path=$DIR" >> $GITHUB_OUTPUT
          echo "project root: $DIR"

      - name: Bersihin
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          rm -rf .gradle build app/build .idea local.properties
          find . -name "*.class" -delete

      - name: Tulis settings.gradle
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Neta's Notes"
          include ':app'
          EOF

      - name: Tulis root build.gradle
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.7.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Tulis app/build.gradle
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          apply plugin: 'kotlin-kapt'

          android {
              namespace 'com.example.notesapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.notesapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.14'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.compose.ui:ui:1.6.0'
              implementation 'androidx.compose.material3:material3:1.2.0'
              implementation 'androidx.compose.ui:ui-tooling-preview:1.6.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
              implementation 'androidx.navigation:navigation-compose:2.7.6'
              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              kapt 'androidx.room:room-compiler:2.6.1'
              implementation 'androidx.datastore:datastore-preferences:1.0.0'
              implementation 'androidx.security:security-crypto:1.1.0-alpha06'
              implementation 'io.coil-kt:coil-compose:2.5.0'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

      - name: Patch import
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          for f in $(find . -name "CanvasView.kt" -o -name "ElementView.kt"); do
            sed -i 's|import androidx.compose.ui.input.pointer.calculatePan|import androidx.compose.foundation.gestures.calculatePan|g' "$f"
            sed -i 's|import androidx.compose.ui.input.pointer.calculateZoom|import androidx.compose.foundation.gestures.calculateZoom|g' "$f"
            sed -i 's|import androidx.compose.ui.input.pointer.calculateRotation|import androidx.compose.foundation.gestures.calculateRotation|g' "$f"
          done

      - name: Generate keystore
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netas-notes-apk
          path: ${{ steps.find.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
