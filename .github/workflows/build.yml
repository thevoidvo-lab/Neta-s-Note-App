name: Build Neta's Notes APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          ZIP=$(find . -name "*.zip" | head -n 1)
          unzip "$ZIP" -d extracted

      - name: Cari project root
        id: find
        run: |
          SETTINGS=$(find extracted -name "settings.gradle" -type f | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle ga ketemu"
            find extracted -type f | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "path=$DIR" >> $GITHUB_OUTPUT

      - name: Bersihin file corrupt
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          rm -rf .gradle
          rm -rf build
          rm -rf app/build
          rm -f local.properties

      - name: Ganti gradle-wrapper.jar
        working-directory: ${{ steps.find.outputs.path }}
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar
          ls -la gradle/wrapper/

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.0.2

      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.find.outputs.path }}
        run: gradle wrapper --gradle-version 8.0.2

      - name: Build APK
        working-directory: ${{ steps.find.outputs.path }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: netas-notes-apk
          path: ${{ steps.find.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
