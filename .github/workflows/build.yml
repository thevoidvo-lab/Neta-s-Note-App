name: Build APK (Custom Package)
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name (misal: com.example.notespriv)'
        required: true
        default: 'com.example.notesapp'
      app_name:
        description: 'Nama app (misal: Notes Priv)'
        required: true
        default: "Neta's Notes"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Patch package name
        working-directory: NetaNotes
        run: |
          NEWPKG="${{ github.event.inputs.package_name }}"
          NEWNAME="${{ github.event.inputs.app_name }}"

          # ganti di app/build.gradle
          sed -i "s|namespace 'com.example.notesapp'|namespace '$NEWPKG'|g" app/build.gradle
          sed -i "s|applicationId \"com.example.notesapp\"|applicationId \"$NEWPKG\"|g" app/build.gradle

          # ganti di semua file .kt
          find app/src/main/java -name "*.kt" -exec sed -i "s|package com.example.notesapp|package $NEWPKG|g" {} \;
          find app/src/main/java -name "*.kt" -exec sed -i "s|com.example.notesapp|$NEWPKG|g" {} \;

          # pindahin folder java
          OLD_DIR=$(find app/src/main/java -type d -name "notesapp" | head -n 1)
          if [ -n "$OLD_DIR" ]; then
            PARENT=$(dirname "$OLD_DIR")
            NEW_DIR="$PARENT/notespriv"
            mv "$OLD_DIR" "$NEW_DIR"
          fi

          # ganti app_name di strings.xml
          sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$NEWNAME</string>|g" app/src/main/res/values/strings.xml

          echo "=== cek hasil patch ==="
          grep -n "namespace\|applicationId" app/build.gradle | head -5
          grep -rn "^package" app/src/main/java | head -3
          grep -n "app_name" app/src/main/res/values/strings.xml

      - name: Build
        working-directory: NetaNotes
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netas-notes-apk-${{ github.event.inputs.package_name }}
          path: NetaNotes/app/build/outputs/apk/debug/app-debug.apk
