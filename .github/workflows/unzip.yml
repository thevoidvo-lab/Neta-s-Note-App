name: Unzip Project
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          ZIP=$(find . -name "*.zip" | head -n 1)
          unzip -o "$ZIP" -d extracted
      - name: Commit hasil unzip
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp -r extracted/* .
          rm -rf extracted
          rm -f "$(find . -name '*.zip' | head -n 1)"
          git add .
          git commit -m "unzip project" || echo "ga ada perubahan"
          git push
